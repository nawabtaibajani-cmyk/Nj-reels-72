<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nawab Jani 72</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #000;
      color: #fff;
    }

    header {
      height: 60px;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid #333;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    .logo span {
      color: #ff0055;
    }

    .add {
      font-size: 30px;
      cursor: pointer;
    }

    .feed {
      padding-bottom: 75px;
    }

    .reel {
      height: calc(100vh - 60px);
      min-height: 600px;
      position: relative;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 2px solid #000;
      overflow: hidden;
    }

    .reel-content {
      text-align: center;
    }

    .reel-content .play {
      font-size: 70px;
      margin-bottom: 15px;
    }

    .reel-content h2 {
      font-size: 28px;
    }

    .reel-content p {
      margin-top: 8px;
      color: #ccc;
    }

    .actions {
      position: absolute;
      right: 15px;
      bottom: 100px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      text-align: center;
    }

    .action {
      font-size: 28px;
      cursor: pointer;
    }

    .action small {
      display: block;
      font-size: 12px;
      margin-top: 3px;
    }

    .caption {
      position: absolute;
      left: 15px;
      bottom: 30px;
      max-width: 75%;
    }

    .caption b {
      font-size: 17px;
    }

    .caption p {
      margin-top: 7px;
      color: #ddd;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: #111;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #333;
      z-index: 20;
    }

    nav div {
      text-align: center;
      font-size: 24px;
      cursor: pointer;
    }

    nav span {
      display: block;
      font-size: 10px;
      margin-top: 3px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">NJ<span>72</span></div>
    <div class="add" onclick="upload()">＋</div>
  </header>

  <main class="feed">

    <section class="reel">
      <div class="reel-content">
        <div class="play">▶️</div>
        <h2>Nawab Jani 72</h2>
        <p>Short videos ka naya platform</p>
      </div>

      <div class="actions">
        <div class="action" onclick="like(this)">
          ❤️
          <small>0</small>
        </div>

        <div class="action">
          💬
          <small>0</small>
        </div>

        <div class="action">
          ↗️
          <small>Share</small>
        </div>
      </div>

      <div class="caption">
        <b>@nawabjani72</b>
        <p>Welcome to NJ72 🚀</p>
      </div>
    </section>

  </main>

  <nav>
    <div onclick="home()">🏠<span>Home</span></div>
    <div onclick="search()">🔍<span>Search</span></div>
    <div onclick="upload()">➕<span>Create</span></div>
    <div onclick="profile()">👤<span>Profile</span></div>
  </nav>

  <script>
    function like(element) {
      let number = element.querySelector("small");
      let count = parseInt(number.innerText);

      if (element.dataset.liked !== "yes") {
        count++;
        element.dataset.liked = "yes";
        element.firstChild.textContent = "❤️";
      } else {
        count--;
        element.dataset.liked = "no";
      }

      number.innerText = count;
    }

    function upload() {
      alert("Video upload feature jaldi aa raha hai 🚀");
    }

    function home() {
      window.scrollTo(0, 0);
    }

    function search() {
      alert("Search feature jaldi aa raha hai 🔍");
    }

    function profile() {
      alert("Profile feature jaldi aa raha hai 👤");
    }
  </script>

</body>
</html>
