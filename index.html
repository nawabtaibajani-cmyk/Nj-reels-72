<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NJ Reels 72</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}

.app{
  max-width:500px;
  height:100vh;
  margin:auto;
  background:#111;
  position:relative;
  overflow:hidden;
}

header{
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  z-index:10;
  background:linear-gradient(#000aa,#0000);
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.logo span{
  color:#ff1744;
}

.upload{

  border:0;

  border-radius:20px;

}

.reels{
  height:100vh;
  overflow-y:auto;
  scroll-snap-type:y mandatory;
}

.reel{
  height:100vh;
  position:relative;
  scroll-snap-align:start;
  background:#222;
}

.reel video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.info{

  left:15px;

  width:75%;

}

.username{
  font-size:18px;
  font-weight:bold;
  margin-bottom:8px;
}

.caption{
  font-size:15px;
}

.actions{

  right:12px;
  bottom:85px;

  flex-direction:column;
  gap:18px;
  align-items:center;
}

.action{

  border:0;

  height:48px;

  font-size:22px;
}

.count{

}
