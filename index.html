<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>NJ72 - Nawab Jani 72</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

button,input{
  font:inherit;
}

button{
  border:0;
  background:none;
  color:white;
  cursor:pointer;
}

#app{
  width:100%;
  height:100vh;
  background:#000;
  position:relative;
}

/* TOP BAR */
.topbar{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:64px;
  background:rgba(10,10,10,.96);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  z-index:50;
  border-bottom:1px solid #252525;
}

.logo{
  font-size:32px;
  font-weight:900;
  font-style:italic;
}

.logo span{
  color:#ff0055;
}

.plus{
  font-size:37px;
  line-height:1;
}

/* FEED */
.feed{
  position:absolute;
  top:64px;
  bottom:70px;
  left:0;
  right:0;
  overflow-y:auto;
  scroll-snap-type:y mandatory;
  overscroll-behavior-y:contain;
  scrollbar-width:none;
}

.feed::-webkit-scrollbar{
  display:none;
}

.reel{
  width:100%;
  min-height:calc(100vh - 134px);
  position:relative;
  scroll-snap-align:start;
  background:#111;
  overflow:hidden;
}

.reel video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  background:#181818;
}

.reelShade{
  position:absolute;
  inset:0;
  background:linear-gradient(
    to bottom,
    rgba(0,0,0,.2),
    transparent 30%,
    transparent 60%,
    rgba(0,0,0,.75)
  );
  pointer-events:none;
}

.playBtn{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:82px;
  height:82px;
  border-radius:50%;
  background:rgba(255,255,255,.92);
  color:#111;
  font-size:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:5;
}

.playBtn.hide{
  opacity:0;
  pointer-events:none;
}

.videoTitle{
  position:absolute;
  top:25px;
  left:20px;
  font-size:20px;
  font-weight:bold;
  text-shadow:0 2px 5px #000;
}

.sideActions{
  position:absolute;
  right:12px;
  bottom:115px;
  width:65px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:18px;
  z-index:8;
}

.action{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  font-weight:bold;
  text-shadow:0 2px 5px #000;
}

.actionIcon{
  width:50px;
  height:50px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:34px;
}

.count{
  font-size:14px;
}

.likeBtn.liked .actionIcon{
  color:#ff1744;
  transform:scale(1.15);
}

.shareIcon{
  background:#70c9ed;
  color:white;
  border-radius:7px;
  width:46px;
  height:46px;
  font-size:29px;
}

.info{
  position:absolute;
  left:18px;
  bottom:22px;
  right:85px;
  z-index:8;
  text-shadow:0 2px 5px #000;
}

.username{
  font-size:21px;
  font-weight:bold;
  margin-bottom:8px;
}

.caption{
  font-size:16px;
  line-height:1.4;
}

/* BOTTOM NAV */
.bottomNav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:70px;
  background:#090909;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:60;
  border-top:1px solid #252525;
}

.navBtn{
  width:25%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:3px;
  color:#aaa;
}

.navBtn.active{
  color:white;
}

.navIcon{
  font-size:27px;
}

.navText{
  font-size:12px;
}

/* SEARCH */
.panel{
  position:fixed;
  inset:64px 0 70px;
  background:#111;
  z-index:40;
  display:none;
  overflow-y:auto;
  padding:20px;
}

.panel.show{
  display:block;
}

.searchBox{
  width:100%;
  height:50px;
  background:#252525;
  border:1px solid #444;
  border-radius:25px;
  padding:0 20px;
  color:#fff;
  outline:none;
}

.searchResults{
  margin-top:20px;
}

.result{
  padding:15px;
  background:#1d1d1d;
  border-radius:12px;
  margin-bottom:10px;
}

/* PROFILE */
.profileHead{
  text-align:center;
  padding:25px 10px;
}

.avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  background:linear-gradient(135deg,#ff0055,#ff8a00);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:35px;
  font-weight:bold;
  margin:auto;
}

.profileHead h2{
  margin-top:12px;
}

.stats{
  display:flex;
  justify-content:center;
  gap:35px;
  margin-top:20px;
}

.stat b{
  display:block;
  font-size:20px;
}

.stat span{
  color:#aaa;
  font-size:12px;
}

/* CREATE */
.createPanel{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.88);
  z-index:100;
  display:none;
  align-items:flex-end;
}

.createPanel.show{
  display:flex;
}

.sheet{
  width:100%;
  background:#181818;
  border-radius:25px 25px 0 0;
  padding:25px;
  max-height:90vh;
  overflow:auto;
}

.sheet h2{
  margin-bottom:20px;
}

.close{
  float:right;
  font-size:27px;
}

.uploadLabel{
  display:block;
  background:#ff0055;
  text-align:center;
  padding:15px;
  border-radius:12px;
  margin:10px 0;
  font-weight:bold;
}

#videoInput,#storyInput{
  display:none;
}

.preview{
  width:100%;
  max-height:300px;
  object-fit:contain;
  background:#000;
  border-radius:12px;
  display:none;
  margin:15px 0;
}

.field{
  width:100%;
  background:#252525;
  color:white;
  border:1px solid #444;
  border-radius:10px;
  padding:13px;
  margin:7px 0;
  outline:none;
}

.primary{
  width:100%;
  padding:14px;
  background:#ff0055;
  border-radius:12px;
  font-weight:bold;
  margin-top:10px;
}

/* FILTERS */
.filterTitle{
  margin-top:18px;
  margin-bottom:8px;
}

.filters{
  display:flex;
  gap:8px;
  overflow-x:auto;
}

.filterBtn{
  white-space:nowrap;
  background:#303030;
  padding:9px 14px;
  border-radius:20px;
}

.filterBtn.active{
  background:#ff0055;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  z-index:150;
  display:none;
  align-items:flex-end;
  justify-content:center;
}

.modal.show{
  display:flex;
}

.modalBox{
  width:100%;
  max-height:75vh;
  background:#191919;
  border-radius:22px 22px 0 0;
  padding:20px;
  overflow:auto;
}

.modalHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.modalHeader h3{
  font-size:20px;
}

.comments{
  min-height:150px;
}

.comment{
  padding:12px 0;
  border-bottom:1px solid #333;
}

.comment b{
  display:block;
  margin-bottom:4px;
}

.commentInput{
  display:flex;
  gap:8px;
  margin-top:15px;
  position:sticky;
  bottom:0;
  background:#191919;
  padding-top:10px;
}

.commentInput input{
  flex:1;
  background:#292929;
  color:white;
  border:0;
  border-radius:22px;
  padding:12px 15px;
  outline:none;
}

.send{
  width:48px;
  height:48px;
  border-radius:50%;
  background:#ff0055;
  font-size:20px;
}

/* SHARE */
.shareOptions{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  text-align:center;
}

.shareOption{
  background:#252525;
  border-radius:15px;
  padding:15px 5px;
}

.shareOption div{
  font-size:27px;
  margin-bottom:5px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:90px;
  transform:translateX(-50%);
  background:#fff;
  color:#111;
  padding:12px 20px;
  border-radius:25px;
  z-index:300;
  display:none;
  font-weight:bold;
}

.toast.show{
  display:block;
}

/* STORY */
.storyRow{
  display:flex;
  gap:15px;
  overflow-x:auto;
  padding:10px 0 20px;
}

.story{
  min-width:70px;
  text-align:center;
  font-size:11px;
}

.storyCircle{
  width:62px;
  height:62px;
  border-radius:50%;
  padding:3px;
  background:linear-gradient(45deg,#ff0055,#ffcc00);
  margin:auto auto 5px;
}

.storyCircle div{
  width:100%;
  height:100%;
  background:#222;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:25px;
}

/* FILTER CLASSES */
.f-normal{}
.f-contrast{filter:contrast(1.35)}
.f-bright{filter:brightness(1.25)}
.f-vintage{filter:sepia(.5) contrast(1.1)}
.f-cool{filter:saturate(1.2) hue-rotate(15deg)}
.f-gray{filter:grayscale(1)}
.f-warm{filter:saturate(1.5) sepia(.2)}
</style>
</head>

<body>

<div id="app">

<!-- TOP -->
<header class="topbar">
  <div class="logo">NJ<span>72</span></div>
  <button class="plus" onclick="openCreate()">+</button>
</header>

<!-- FEED -->
<main class="feed" id="feed"></main>

<!-- SEARCH PANEL -->
<section class="panel" id="searchPanel">
  <input
    id="searchInput"
    class="searchBox"
    placeholder="🔎 वीडियो या यूजर खोजें..."
    oninput="searchVideos()"
  >
  <div class="searchResults" id="searchResults"></div>
</section>

<!-- PROFILE PANEL -->
<section class="panel" id="profilePanel">

  <div class="profileHead">
    <div class="avatar">NJ</div>
    <h2>@nawabjani72</h2>
    <p style="color:#aaa;margin-top:5px">Nawab Jani 72 🚀</p>

    <div class="stats">
      <div class="stat">
        <b id="postCount">0</b>
        <span>वीडियो</span>
      </div>

      <div class="stat">
        <b id="likeCount">0</b>
        <span>Likes</span>
      </div>

      <div class="stat">
        <b>72</b>
        <span>Followers</span>
      </div>
    </div>
  </div>

  <h3>📖 Stories</h3>
  <div class="storyRow" id="storyRow"></div>

  <h3 style="margin-top:10px">🎬 मेरे वीडियो</h3>
  <div id="myVideos"></div>

</section>

<!-- BOTTOM NAV -->
<nav class="bottomNav">

  <button class="navBtn active" onclick="showHome()">
    <div class="navIcon">🏠</div>
    <div class="navText">घर</div>
  </button>

  <button class="navBtn" onclick="showSearch()">
    <div class="navIcon">🔎</div>
    <div class="navText">खोज</div>
  </button>

  <button class="navBtn" onclick="openCreate()">
    <div class="navIcon" style="font-size:38px">+</div>
    <div class="navText">बनाएं</div>
  </button>

  <button class="navBtn" onclick="showProfile()">
    <div class="navIcon">👤</div>
    <div class="navText">प्रोफाइल</div>
  </button>

</nav>

<!-- CREATE -->
<div class="createPanel" id="createPanel">

  <div class="sheet">

    <button class="close" onclick="closeCreate()">×</button>

    <h2>➕ नया वीडियो बनाएं</h2>

    <label class="uploadLabel" for="videoInput">
      🎬 वीडियो चुनें
    </label>

    <input
      id="videoInput"
      type="file"
      accept="video/*"
      onchange="previewVideo(event)"
    >

    <video
      id="videoPreview"
      class="preview"
      controls
      playsinline
    ></video>

    <input
      id="captionInput"
      class="field"
      placeholder="कैप्शन लिखें..."
    >

    <input
      id="locationInput"
      class="field"
      placeholder="📍 लोकेशन..."
    >

    <div class="filterTitle">🎨 Filter</div>

    <div class="filters">
      <button class="filterBtn active" onclick="setFilter('f-normal',this)">Normal</button>
      <button class="filterBtn" onclick="setFilter('f-contrast',this)">Contrast</button>
      <button class="filterBtn" onclick="setFilter('f-bright',this)">Bright</button>
      <button class="filterBtn" onclick="setFilter('f-vintage',this)">Vintage</button>
      <button class="filterBtn" onclick="setFilter('f-cool',this)">Cool</button>
      <button class="filterBtn" onclick="setFilter('f-gray',this)">B&W</button>
      <button class="filterBtn" onclick="setFilter('f-warm',this)">Warm</button>
    </div>

    <button class="primary" onclick="publishVideo()">
      🚀 NJ72 पर पोस्ट करें
    </button>

    <hr style="border-color:#333;margin:25px 0">

    <h2>📖 Story डालें</h2>

    <label class="uploadLabel" for="storyInput">
      📸 Story फोटो/वीडियो चुनें
    </label>

    <input
      id="storyInput"
      type="file"
      accept="image/*,video/*"
      onchange="addStory(event)"
    >

  </div>
</div>

<!-- COMMENT MODAL -->
<div class="modal" id="commentModal">

  <div class="modalBox">

    <div class="modalHeader">
      <h3>💬 Comments</h3>
      <button onclick="closeModal('commentModal')" style="font-size:28px">×</button>
    </div>

    <div class="comments" id="comments"></div>

    <div class="commentInput">
      <input id="commentText" placeholder="Comment लिखें...">
      <button class="send" onclick="sendComment()">➤</button>
    </div>

  </div>
</div>

<!-- SHARE MODAL -->
<div class="modal" id="shareModal">

  <div class="modalBox">

    <div class="modalHeader">
      <h3>↗️ Share</h3>
      <button onclick="closeModal('shareModal')" style="font-size:28px">×</button>
    </div>

    <div class="shareOptions">

      <button class="shareOption" onclick="nativeShare()">
        <div>📱</div>
        Share
      </button>

      <button class="shareOption" onclick="copyLink()">
        <div>🔗</div>
        Copy
      </button>

      <button class="shareOption" onclick="shareWhatsApp()">
        <div>💬</div>
        WhatsApp
      </button>

      <button class="shareOption" onclick="shareTelegram()">
        <div>✈️</div>
        Telegram
      </button>

    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

</div>

<script>

/* =========================
   DATA
========================= */

let videos = JSON.parse(localStorage.getItem("nj72Videos") || "[]");

let stories = JSON.parse(localStorage.getItem("nj72Stories") || "[]");

let currentVideo = null;

let selectedFilter = "f-normal";


/* =========================
   DEMO VIDEO
========================= */

const demoVideo =
"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4";


/* =========================
   START
========================= */

function init(){

  if(videos.length === 0){

    videos.push({
      id:Date.now(),
      src:demoVideo,
      username:"@nawabjani72",
      caption:"NJ72 ❤️ अपनी लघु वीडियो कम्युनिटी में आपका स्वागत है 🚀",
      location:"India 🇮🇳",
      likes:0,
      comments:[]
    });

    saveVideos();

  }

  renderFeed();
  renderStories();
  updateProfile();

}


/* =========================
   SAVE
========================= */

function saveVideos(){
  localStorage.setItem("nj72Videos",JSON.stringify(videos));
}

function saveStories(){
  localStorage.setItem("nj72Stories",JSON.stringify(stories));
}


/* =========================
   FEED
========================= */

function renderFeed(){

  const feed=document.getElementById("feed");

  feed.innerHTML="";

  videos.forEach((v,index)=>{

    const reel=document.createElement("article");

    reel.className="reel";

    reel.dataset.id=v.id;

    reel.innerHTML=`

      <video
        src="${v.src}"
        playsinline
        loop
        preload="metadata"
      ></video>

      <div class="reelShade"></div>

      <div class="videoTitle">
        ${v.location || "NJ72 🚀"}
      </div>

      <button class="playBtn" onclick="toggleVideo(this)">
        ▶
      </button>

      <div class="sideActions">

        <button class="action likeBtn" onclick="likeVideo(${v.id},this)">
          <div class="actionIcon">❤️</div>
          <div class="count">${v.likes || 0}</div>
        </button>

        <button class="action" onclick="openComments(${v.id})">
          <div class="actionIcon">💬</div>
          <div class="count">${(v.comments || []).length}</div>
        </button>

        <button class="action" onclick="openShare(${v.id})">
          <div class="actionIcon shareIcon">↗</div>
          <div>Share</div>
        </button>

        <button class="action" onclick="toggleMute(this)">
          <div class="actionIcon">🔊</div>
          <div>Sound</div>
        </button>

      </div>

      <div class="info">

        <div class="username">
          ${v.username}
        </div>

        <div class="caption">
          ${escapeHTML(v.caption || "")}
        </div>

      </div>
    `;

    feed.appendChild(reel);

  });

  setupVideoObserver();

}


/* =========================
   VIDEO OBSERVER
========================= */

function setupVideoObserver(){

  const observer=new IntersectionObserver(entries=>{

    entries.forEach(entry=>{

      const video=entry.target.querySelector("video");

      const play=entry.target.querySelector(".playBtn");

      if(entry.isIntersecting){

        document.querySelectorAll(".reel video").forEach(v=>{

          if(v!==video){
            v.pause();
          }

        });

        video.play().then(()=>{

          play.classList.add("hide");

        }).catch(()=>{});

      }

    });

  },{
    threshold:.65
  });

  document.querySelectorAll(".reel").forEach(reel=>{
    observer.observe(reel);
  });

}


/* =========================
   PLAY PAUSE
========================= */

function toggleVideo(btn){

  const reel=btn.closest(".reel");

  const video=reel.querySelector("video");

  if(video.paused){

    video.play();

    btn.textContent="▶";

    btn.classList.add("hide");

  }else{

    video.pause();

    btn.textContent="▶";

    btn.classList.remove("hide");

  }

}


/* =========================
   LIKE
========================= */

function likeVideo(id,button){

  const video=videos.find(v=>v.id===id);

  if(!video)return;

  const liked=localStorage.getItem("liked_"+id)==="yes";

  if(liked){

    video.likes=Math.max(0,(video.likes||0)-1);

    localStorage.removeItem("liked_"+id);

    button.classList.remove("liked");

  }else{

    video.likes=(video.likes||0)+1;

    localStorage.setItem("liked_"+id,"yes");

    button.classList.add("liked");

    showToast("❤️ Liked");

  }

  button.querySelector(".count").textContent=video.likes;

  saveVideos();

  updateProfile();

}


/* =========================
   COMMENTS
========================= */

function openComments(id){

  currentVideo=id;

  const video=videos.find(v=>v.id===id);

  const box=document.getElementById("comments");

  box.innerHTML="";

  if(!video.comments || video.comments.length===0){

    box.innerHTML=
      `<div style="color:#aaa;text-align:center;padding:35px">
        अभी कोई comment नहीं है। पहला comment करें ❤️
      </div>`;

  }else{

    video.comments.forEach(c=>{

      const div=document.createElement("div");

      div.className="comment";

      div.innerHTML=`
        <b>${escapeHTML(c.user)}</b>
        <span>${escapeHTML(c.text)}</span>
      `;

      box.appendChild(div);

    });

  }

  document.getElementById("commentModal").classList.add("show");

}


function sendComment(){

  const input=document.getElementById("commentText");

  const text=input.value.trim();

  if(!text)return;

  const video=videos.find(v=>v.id===currentVideo);

  if(!video)return;

  if(!video.comments){
    video.comments=[];
  }

  video.comments.push({
    user:"@nawabjani72",
    text:text
  });

  input.value="";

  saveVideos();

  openComments(currentVideo);

  renderFeed();

  showToast("💬 Comment added");

}


/* =========================
   SHARE
========================= */

function openShare(id){

  currentVideo=id;

  document.getElementById("shareModal").classList.add("show");

}


async function nativeShare(){

  const url=location.href;

  if(navigator.share){

    try{

      await navigator.share({
        title:"NJ72",
        text:"Nawab Jani 72 पर यह वीडियो देखें 🚀",
        url:url
      });

    }catch(e){}

  }else{

    copyLink();

  }

}


function copyLink(){

  navigator.clipboard.writeText(location.href);

  showToast("🔗 Link copied");

}


function shareWhatsApp(){

  const text=
  encodeURIComponent("NJ72 पर यह वीडियो देखें 🚀 "+location.href);

  window.open("https://wa.me/?text="+text,"_blank");

}


function shareTelegram(){

  const url=encodeURIComponent(location.href);

  window.open(
    "https://t.me/share/url?url="+url+"&text=NJ72 🚀",
    "_blank"
  );

}


/* =========================
   SOUND
========================= */

function toggleMute(button){

  const reel=button.closest(".reel");

  const video=reel.querySelector("video");

  video.muted=!video.muted;

  button.querySelector(".actionIcon").textContent=
    video.muted ? "🔇" : "🔊";

}


/* =========================
   CREATE
========================= */

function openCreate(){

  document.getElementById("createPanel").classList.add("show");

}


function closeCreate(){

  document.getElementById("createPanel").classList.remove("show");

}


/* =========================
   VIDEO PREVIEW
========================= */

function previewVideo(event){

  const file=event.target.files[0];

  if(!file)return;

  const preview=document.getElementById("videoPreview");

  preview.src=URL.createObjectURL(file);

  preview.className=
    "preview "+selectedFilter;

  preview.style.display="block";

}


/* =========================
   FILTER
========================= */

function setFilter(filter,button){

  selectedFilter=filter;

  document.querySelectorAll(".filterBtn").forEach(b=>{
    b.classList.remove("active");
  });

  button.classList.add("active");

  const preview=document.getElementById("videoPreview");

  preview.className="preview "+filter;

}


/* =========================
   PUBLISH
========================= */

function publishVideo(){

  const input=document.getElementById("videoInput");

  const file=input.files[0];

  if(!file){

    showToast("पहले वीडियो चुनें");

    return;

  }

  const caption=
    document.getElementById("captionInput").value.trim()
    || "NJ72 🚀";

  const location=
    document.getElementById("locationInput").value.trim()
    || "India 🇮🇳";

  const url=URL.createObjectURL(file);

  const newVideo={

    id:Date.now(),

    src:url,

    username:"@nawabjani72",

    caption:caption,

    location:location,

    likes:0,

    comments:[],

    filter:selectedFilter

  };

  videos.unshift(newVideo);

  saveVideos();

  renderFeed();

  updateProfile();

  closeCreate();

  document.getElementById("videoInput").value="";

  document.getElementById("captionInput").value="";

  document.getElementById("locationInput").value="";

  document.getElementById("videoPreview").style.display="none";

  showHome();

  showToast("🚀 Video posted");


}


/* =========================
   STORY
========================= */

function addStory(event){

  const file=event.target.files[0];

  if(!file)return;

  const url=URL.createObjectURL(file);

  stories.unshift({

    id:Date.now(),

    src:url,

    type:file.type.startsWith("video")
      ? "video"
      : "image"

  });

  saveStories();

  renderStories();

  showToast("📖 Story added");

}


function renderStories(){

  const row=document.getElementById("storyRow");

  row.innerHTML="";

  if(stories.length===0){

    row.innerHTML=`
      <div class="story">
        <div class="storyCircle">
          <div>+</div>
        </div>
        Add Story
      </div>
    `;

    return;

  }

  stories.forEach((s,i)=>{

    const div=document.createElement("div");

    div.className="story";

    div.innerHTML=`
      <div class="storyCircle">
        <div>${s.type==="video"?"🎬":"📸"}</div>
      </div>
      Story ${i+1}
    `;

    div.onclick=()=>{

      if(s.type==="video"){

        window.open(s.src,"_blank");

      }else{

        window.open(s.src,"_blank");

      }

    };

    row.appendChild(div);

  });

}


/* =========================
   SEARCH
========================= */

function showSearch(){

  hidePanels();

  document.getElementById("searchPanel").classList.add("show");

  document.getElementById("searchInput").focus();

}


function searchVideos(){

  const q=
    document.getElementById("searchInput")
    .value
    .toLowerCase()
    .trim();

  const results=document.getElementById("searchResults");

  results.innerHTML="";

  const found=videos.filter(v=>

    v.username.toLowerCase().includes(q) ||

    v.caption.toLowerCase().includes(q) ||

    v.location.toLowerCase().includes(q)

  );

  if(found.length===0){

    results.innerHTML=
      `<div style="text-align:center;color:#aaa;padding:30px">
        कोई वीडियो नहीं मिला 😔
      </div>`;

    return;

  }

  found.forEach(v=>{

    const div=document.createElement("div");

    div.className="result";

    div.innerHTML=`
      <b>${v.username}</b><br>
      ${escapeHTML(v.caption)}<br>
      <small style="color:#aaa">${v.location}</small>
    `;

    div.onclick=()=>{

      showHome();

      setTimeout(()=>{

        const reel=
          document.querySelector(
            '.reel[data-id="'+v.id+'"]'
          );

        if(reel){

          reel.scrollIntoView({
            behavior:"smooth"
          });

        }

      },100);

    };

    results.appendChild(div);

  });

}


/* =========================
   PROFILE
========================= */

function showProfile(){

  hidePanels();

  document.getElementById("profilePanel").classList.add("show");

  updateProfile();

}


function updateProfile(){

  document.getElementById("postCount").textContent=videos.length;

  const likes=
    videos.reduce((sum,v)=>sum+(v.likes||0),0);

  document.getElementById("likeCount").textContent=likes;

  const myVideos=document.getElementById("myVideos");

  if(!myVideos)return;

  myVideos.innerHTML="";

  videos.forEach((v,i)=>{

    const div=document.createElement("div");

    div.style.cssText=
      "background:#1c1c1c;padding:15px;margin:8px 0;border-radius:12px";

    div.innerHTML=`
      🎬 Video ${i+1}<br>
      ❤️ ${v.likes||0} Likes
      &nbsp; 💬 ${(v.comments||[]).length} Comments
    `;

    myVideos.appendChild(div);

  });

}


/* =========================
   HOME
========================= */

function showHome(){

  hidePanels();

  document.querySelector(".feed").scrollTop=0;

}


function hidePanels(){

  document.querySelectorAll(".panel").forEach(p=>{
    p.classList.remove("show");
  });

}


/* =========================
   MODALS
========================= */

function closeModal(id){

  document.getElementById(id).classList.remove("show");

}


/* =========================
   TOAST
========================= */

let toastTimer;

function showToast(text){

  const toast=document.getElementById("toast");

  toast.textContent=text;

  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer=setTimeout(()=>{

    toast.classList.remove("show");

  },1800);

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================
   KEYBOARD
========================= */

document.addEventListener("keydown",e=>{

  if(e.key==="Escape"){

    closeCreate();

    closeModal("commentModal");

    closeModal("shareModal");

  }

});


/* =========================
   DOUBLE TAP LIKE
========================= */

document.addEventListener("dblclick",e=>{

  const reel=e.target.closest(".reel");

  if(!reel)return;

  const id=Number(reel.dataset.id);

  const button=reel.querySelector(".likeBtn");

  const liked=
    localStorage.getItem("liked_"+id)==="yes";

  if(!liked){

    likeVideo(id,button);

  }

});


/* =========================
   INIT
========================= */

init();

</script>
