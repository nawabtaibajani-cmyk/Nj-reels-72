<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NJ Reels 72</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}

.app{
  width:100%;
  max-width:500px;
  height:100vh;
  margin:auto;
  background:#111;
  overflow:hidden;
  position:relative;
}

.header{
  height:55px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  background:#111;
  position:absolute;
  top:0;
  left:0;
  width:100%;
  z-index:10;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.logo span{
  color:#ff1744;
}

.icon{
  font-size:24px;
}

.reels{
  width:100%;
  height:100vh;
  overflow-y:auto;
  scroll-snap-type:y mandatory;
}

.reel{
  width:100%;
  height:100vh;
  scroll-snap-align:start;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#222;
}

.reel video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.demo{
  font-size:28px;
  font-weight:bold;
  text-align:center;
}

.info{
  position:absolute;
  left:15px;
  bottom:35px;
  z-index:5;
  text-shadow:0 2px 5px #000;
}

.username{
  font-size:18px;
  font-weight:bold;
  margin-bottom:8px;
}

.caption{
  font-size:15px;
}

.actions{
  position:absolute;
  right:12px;
  bottom:35px;
  display:flex;
  flex-direction:column;
  gap:20px;
  z-index:5;
}

.action{
  text-align:center;
  font-size:28px;
  cursor:pointer;
}

.action small{
  display:block;
  font-size:12px;
}

.upload{
  position:absolute;
  right:15px;
  top:65px;
  z-index:20;
  background:#ff1744;
  color:#fff;
  border:0;
  border-radius:25px;
  padding:10px 16px;
  font-weight:bold;
}

input{
  display:none;
}
</style>
</head>

<body>

<div class="app">

<header class="header">
  <div class="logo">NJ <span>Reels 72</span></div>
  <div class="icon">🔍</div>
</header>

<button class="upload" onclick="document.getElementById('videoInput').click()">
  ＋ Upload
</button>

<input id="videoInput" type="file" accept="video/*">

<div class="reels">

  <div class="reel">
    <div class="demo">🎬<br>NJ REELS 72</div>

    <div class="info">
      <div class="username">@njreels72</div>
      <div class="caption">Welcome to NJ Reels ❤️</div>
    </div>

    <div class="actions">
      <div class="action" onclick="like(this)">❤️<small>0</small></div>
      <div class="action">💬<small>0</small></div>
      <div class="action">↗️<small>Share</small></div>
    </div>
  </div>

  <div class="reel">
    <div class="demo">🔥<br>Your Reel Here</div>

    <div class="info">
      <div class="username">@njreels72</div>
      <div class="caption">Make your own short videos 🚀</div>
    </div>

    <div class="actions">
      <div class="action" onclick="like(this)">❤️<small>0</small></div>
      <div class="action">💬<small>0</small></div>
      <div class="action">↗️<small>Share</small></div>
    </div>
  </div>

</div>

</div>

<script>
function like(button){
  let count = button.querySelector("small");
  let number = Number(count.innerText);

  if(button.dataset.liked === "yes"){
    number--;
    button.dataset.liked = "no";
  }else{
    number++;
    button.dataset.liked = "yes";
  }

  count.innerText = number;
}

document.getElementById("videoInput").addEventListener("change",function(e){

  const file = e.target.files[0];

  if(!file) return;

  const url = URL.createObjectURL(file);

  const reel = document.createElement("div");
  reel.className = "reel";

  reel.innerHTML = `
    <video src="${url}" controls autoplay loop playsinline></video>

    <div class="info">
      <div class="username">@njreels72</div>
      <div class="caption">My new NJ Reel 🎬</div>
    </div>

    <div class="actions">
      <div class="action" onclick="like(this)">❤️<small>0</small></div>
      <div class="action">💬<small>0</small></div>
      <div class="action">↗️<small>Share</small></div>
    </div>
  `;

  document.querySelector(".reels").prepend(reel);
});
</script>

</body>
</html>
