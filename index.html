<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NJ Reels 72</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#000;
  color:white;
  font-family:Arial,sans-serif;
}
.app{
  height:100vh;
  max-width:500px;
  margin:auto;
  background:#111;
  position:relative;
  overflow:hidden;
}
.reel{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#222,#8b1e3f,#111);
  font-size:32px;
  font-weight:bold;
}
.logo{
  position:absolute;
  top:18px;
  left:18px;
  font-size:25px;
  z-index:2;
}
.right{
  position:absolute;
  right:15px;
  bottom:110px;
  display:flex;
  flex-direction:column;
  gap:22px;
  text-align:center;
  font-size:26px;
}
.right span{
  display:block;
  font-size:13px;
}
.bottom{
  position:absolute;
  bottom:0;
  width:100%;
  height:65px;
  background:rgba(0,0,0,.75);
  display:flex;
  justify-content:space-around;
  align-items:center;
  font-size:13px;
}
.bottom div{text-align:center}
</style>
</head>

<body>
<div class="app">

  <div class="logo">NJ ✦ Reels 72</div>

  <div class="reel">
    NJ REELS
  </div>

  <div class="right">
    ❤️<span>Like</span>
    💬<span>Comment</span>
    ↗️<span>Share</span>
    🔖<span>Save</span>
  </div>

  <div class="bottom">
    <div>🏠<br>Home</div>
    <div>🔍<br>Search</div>
    <div>➕<br>Create</div>
    <div>❤️<br>Activity</div>
    <div>👤<br>Profile</div>
  </div>

</div>
</body>
</html>
