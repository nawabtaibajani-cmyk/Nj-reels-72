<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NJ Reels 72</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

.app{
  width:100%;
  max-width:500px;
  height:100vh;
  margin:auto;
  background:#000;
  position:relative;
}

.reels{
  width:100%;
  height:100vh;
  overflow-y:auto;
  scroll-snap-type:y mandatory;
}

.reel{
  width:100%;
  height:100vh;
  position:relative;
  scroll-snap-align:start;
  background:#111;
}

.reel video{
  width:100%;
  height:100%;
  object-fit:cover;
  background:#111;
}

.top{
  position:absolute;
  top:0;
  left:0;
  right:0;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:5;
  background:linear-gradient(#000b,transparent);
}

.logo{
  font-size:25px;
  font-weight:bold;
}

.logo span{
  color:#ff1744;
}

.follow{
  border:1px solid #fff;
  padding:7px 13px;
  border-radius:20px;
  background:#0008;
}

.info{
  position:absolute;
  bottom:85px;
  left:15px;
  right:75px;
  z-index:5;
  text-shadow:0 2px 5px #000;
}

.username{
  font-weight:bold;
  font-size:18px;
  margin-bottom:8px;
}

.caption{
  font-size:15px;
  line-height:1.4;
}

.actions{
  position:absolute;
  right:12px;
  bottom:90px;
  display:flex;
  flex-direction:column;
  gap:18px;
  z-index:6;
  text-align:center;
}

.action{
  font-size:30px;
  cursor:pointer;
  user-select:none;
}

.count{
  font-size:12px;
  margin-top:2px;
}

.liked{
  transform:scale(1.15);
}

.bottom{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:65px;
  background:#000;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:20;
}

.bottom button{
  background:none;
  border:0;
  color:#fff;
  font-size:25px;
}

.add{
  width:45px;
  height:38px;
  border-radius:10px;
  background:#fff !important;
  color:#000 !important;
  font-size:25px !important;
}

.upload{
  display:none;
}

.empty{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:30px;
  color:#aaa;
}
</style>
</head>

<body>

<div class="app">

  <div class="reels" id="reels">

    <!-- REEL 1 -->
    <div class="reel">

      <video
        src="https://cdn.coverr.co/videos/coverr-a-woman-dancing-1574/1080p.mp4"
        autoplay
        muted
        loop
        playsinline>
      </video>

      <div class="top">
        <div class="logo">NJ <span>Reels</span></div>
        <div class="follow">Follow</div>
      </div>

      <div class="info">
        <div class="username">@nawab_jani72</div>
        <div class="caption">❤️ Welcome to NJ Reels 72 — Short Videos</div>
      </div>

      <div class="actions">

        <div class="action" onclick="like(this)">
          ❤️
          <div class="count">0</div>
        </div>

        <div class="action">
          💬
          <div class="count">0</div>
        </div>

        <div class="action" onclick="shareReel()">
          📤
          <div class="count">Share</div>
        </div>

        <div class="action">
          ⋮
        </div>

      </div>
    </div>


    <!-- REEL 2 -->
    <div class="reel">

      <video
        src="https://cdn.coverr.co/videos/coverr-a-man-riding-a-bike-1573/1080p.mp4"
        autoplay
        muted
        loop
        playsinline>
      </video>

      <div class="top">
        <div class="logo">NJ <span>Reels</span></div>
        <div class="follow">Follow</div>
      </div>

      <div class="info">
        <div class="username">@nj_reels_72</div>
        <div class="caption">🔥 NJ Reels 72 — Short Videos</div>
      </div>

      <div class="actions">

        <div class="action" onclick="like(this)">
          ❤️
          <div class="count">0</div>
        </div>

        <div class="action">
          💬
          <div class="count">0</div>
        </div>

        <div class="action" onclick="shareReel()">
          📤
          <div class="count">Share</div>
        </div>

        <div class="action">
          ⋮
        </div>

      </div>
    </div>

  </div>


  <!-- BOTTOM MENU -->
  <div class="bottom">

    <button onclick="home()">⌂</button>

    <button onclick="search()">🔍</button>

    <label class="add">
      +
      <input
        class="upload"
        type="file"
        accept="video/*"
        onchange="addVideo(event)">
    </label>

    <button onclick="showMessage()">❤️</button>

    <button onclick="showMessage()">👤</button>

  </div>

</div>


<script>

function like(el){

  let count = el.querySelector(".count");
  let number = parseInt(count.innerText) || 0;

  if(el.classList.contains("liked")){

    number--;

    el.classList.remove("liked");

  }else{

    number++;

    el.classList.add("liked");

  }

  count.innerText = number;

}


function shareReel(){

  if(navigator.share){

    navigator.share({
      title:"NJ Reels 72",
      text:"NJ Reels 72 par reel dekho!"
    });

  }else{

    alert("Share option is device/browser mein available nahi hai.");

  }

}


function addVideo(event){

  const file = event.target.files[0];

  if(!file) return;

  const url = URL.createObjectURL(file);

  const reel = document.createElement("div");

  reel.className = "reel";

  reel.innerHTML = `

    <video
      src="${url}"
      autoplay
      muted
      loop
      playsinline>
    </video>

    <div class="top">
      <div class="logo">NJ <span>Reels</span></div>
      <div class="follow">Follow</div>
    </div>

    <div class="info">
      <div class="username">@nawab_jani72</div>
      <div class="caption">🎬 My New Reel</div>
    </div>

    <div class="actions">

      <div class="action" onclick="like(this)">
        ❤️
        <div class="count">0</div>
      </div>

      <div class="action">
        💬
        <div class="count">0</div>
      </div>

      <div class="action" onclick="shareReel()">
        📤
        <div class="count">Share</div>
      </div>

      <div class="action">
        ⋮
      </div>

    </div>
  `;

  document.getElementById("reels").appendChild(reel);

  reel.scrollIntoView({
    behavior:"smooth"
  });

}


function home(){

  document.getElementById("reels").scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function search(){

  alert("🔍 Search feature jaldi add karenge.");

}


function showMessage(){

  alert("❤️ Feature jaldi add karenge.");

}


/* VIDEO AUTO PLAY / PAUSE */

const observer = new IntersectionObserver(
  entries => {

    entries.forEach(entry => {

      const video = entry.target;

      if(entry.isIntersecting){

        video.play().catch(()=>{});

      }else{

        video.pause();

      }

    });

  },
  {
    threshold:0.7
  }
);


document.querySelectorAll("video").forEach(video => {

  observer.observe(video);

});

</script>

</body>
</html>
