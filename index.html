<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>NJ Reels 72</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

#app{
  height:100dvh;
  max-width:520px;
  margin:auto;
  background:#111;
  position:relative;
}

#reels{
  height:100%;
  overflow-y:auto;
  scroll-snap-type:y mandatory;
  scrollbar-width:none;
}

#reels::-webkit-scrollbar{
  display:none;
}

.reel{
  height:100dvh;
  position:relative;
  scroll-snap-align:start;
  background:#000;
  overflow:hidden;
}

.reel video{
  width:100%;
  height:100%;
  object-fit:cover;
  background:#111;
}

.top{
  position:absolute;
  top:0;
  left:0;
  right:0;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:3;
  background:linear-gradient(#000b,transparent);
}

.logo{
  font-size:27px;
  font-weight:800;
  font-style:italic;
}

.logo span{
  color:#ff1744;
}

.follow{
  border:1px solid #fff;
  border-radius:22px;
  padding:9px 17px;
  background:#0008;
  color:#fff;
  font-weight:700;
}

.info{
  position:absolute;
  left:18px;
  right:85px;
  bottom:25px;
  z-index:3;
  text-shadow:0 1px 5px #000;
}

.username{
  font-size:18px;
  font-weight:800;
  margin-bottom:8px;
}

.caption{
  font-size:15px;
  line-height:1.35;
}

.actions{
  position:absolute;
  right:14px;
  bottom:105px;
  z-index:4;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:18px;
}

.action{
  border:0;
  background:none;
  color:#fff;
  text-align:center;
  font-size:29px;
  cursor:pointer;
  text-shadow:0 2px 5px #000;
}

.action .count{
  font-size:13px;
  margin-top:3px;
  font-weight:700;
}

.liked{
  transform:scale(1.12);
}

.playhint{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:60px;
  opacity:0;
  pointer-events:none;
  z-index:2;
}

.reel.paused .playhint{
  opacity:.85;
}

.loading{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:1;
  font-size:14px;
}

.error{
  position:absolute;
  left:15px;
  right:15px;
  top:50%;
  transform:translateY(-50%);
  text-align:center;
  z-index:2;
  display:none;
}

.error b{
  font-size:18px;
  display:block;
  margin-bottom:8px;
}

.error button{
  padding:10px 16px;
  border:0;
  border-radius:20px;
  font-weight:700;
  margin-top:10px;
}
</style>
</head>

<body>

<div id="app">

<div id="reels">

<!-- REEL 1 -->
<section class="reel">

<video
src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
muted
autoplay
loop
playsinline
preload="metadata">
</video>

<div class="loading">
Video loading…
</div>

<div class="error">
<b>Video load nahi hua</b>
<span>Internet check karke Retry dabaye.</span>
<br>
<button onclick="retry(this)">Retry</button>
</div>

<div class="playhint">
▶
</div>

<div class="top">

<div class="logo">
NJ <span>Reels</span>
</div>

<button class="follow" onclick="followUser(this)">
Follow
</button>

</div>

<div class="info">

<div class="username">
@nj_reels_72
</div>

<div class="caption">
🔥 NJ Reels 72 — Short Videos
</div>

</div>

<div class="actions">

<button class="action" onclick="like(this)">
❤️
<div class="count">0</div>
</button>

<button class="action" onclick="comment()">
💬
<div class="count">0</div>
</button>

<button class="action" onclick="shareReel()">
📤
<div class="count">Share</div>
</button>

</div>

</section>


<!-- REEL 2 -->
<section class="reel">

<video
src="https://www.w3schools.com/html/mov_bbb.mp4"
muted
autoplay
loop
playsinline
preload="metadata">
</video>

<div class="loading">
Video loading…
</div>

<div class="error">
<b>Video load nahi hua</b>
<span>Internet check karke Retry dabaye.</span>
<br>
<button onclick="retry(this)">Retry</button>
</div>

<div class="playhint">
▶
</div>

<div class="top">

<div class="logo">
NJ <span>Reels</span>
</div>

<button class="follow" onclick="followUser(this)">
Follow
</button>

</div>

<div class="info">

<div class="username">
@nj_reels_72
</div>

<div class="caption">
😎 Welcome to NJ Reels 72
</div>

</div>

<div class="actions">

<button class="action" onclick="like(this)">
❤️
<div class="count">0</div>
</button>

<button class="action" onclick="comment()">
💬
<div class="count">0</div>
</button>

<button class="action" onclick="shareReel()">
📤
<div class="count">Share</div>
</button>

</div>

</section>

</div>
</div>


<script>

function like(btn){

const count=btn.querySelector(".count");

let n=parseInt(count.textContent)||0;

if(n===0){

n=1;

}else{

n=0;

}

count.textContent=n;

btn.classList.toggle("liked",n===1);

}


function comment(){

alert("Comments feature jaldi add karenge ❤️");

}


function followUser(btn){

if(btn.textContent.trim()==="Follow"){

btn.textContent="Following";

}else{

btn.textContent="Follow";

}

}


async function shareReel(){

const data={
title:"NJ Reels 72",
text:"NJ Reels 72 par reel dekho!"
};

if(navigator.share){

try{

await navigator.share(data);

}catch(e){}

}else{

alert("Share button dabaya gaya.");

}

}


function retry(btn){

const reel=btn.closest(".reel");

const video=reel.querySelector("video");

reel.querySelector(".error").style.display="none";

video.load();

video.play().catch(()=>{});

}


document.querySelectorAll(".reel").forEach(reel=>{

const video=reel.querySelector("video");

const loading=reel.querySelector(".loading");

const error=reel.querySelector(".error");


video.addEventListener("loadeddata",()=>{

loading.style.display="none";

});


video.addEventListener("playing",()=>{

loading.style.display="none";

reel.classList.remove("paused");

});


video.addEventListener("pause",()=>{

reel.classList.add("paused");

});


video.addEventListener("error",()=>{

loading.style.display="none";

error.style.display="block";

});


video.addEventListener("click",()=>{

if(video.paused){

video.play();

}else{

video.pause();

}

});

});


const observer=new IntersectionObserver(

entries=>{

entries.forEach(entry=>{

const video=entry.target.querySelector("video");

if(entry.isIntersecting){

video.play().catch(()=>{});

}else{

video.pause();

}

});

},

{
threshold:0.65
}

);


document.querySelectorAll(".reel").forEach(reel=>{

observer.observe(reel);

});


</script>

</body>
</html>
