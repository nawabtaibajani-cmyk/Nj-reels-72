<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NJ Reels 72</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#000;
 color:#fff;
 font-family:Arial,sans-serif;
}
.app{
 max-width:500px;
 height:100vh;
 margin:auto;
 background:#111;
 overflow:hidden;
 position:relative;
}
.header{
 height:55px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 15px;
 background:#111;
 position:absolute;
 top:0;
 width:100%;
 z-index:5;
}
.logo{
 font-size:22px;
 font-weight:bold;
}
.logo span{color:#ff1744}
.feed{
 height:100vh;
 overflow-y:auto;
 scroll-snap-type:y mandatory;
}
.reel{
 height:100vh;
 scroll-snap-align:start;
 position:relative;
 background:#222;
 display:flex;
 align-items:center;
 justify-content:center;
}
.reel video{
 width:100%;
 height:100%;
 object-fit:cover;
}
.demo{
 text-align:center;
 font-size:20px;
 padding:30px;
}
.actions{
 position:absolute;
 right:12px;
 bottom:100px;
 display:flex;
 flex-direction:column;
 gap:18px;
 text-align:center;
 z-index:3;
}
.action{
 font-size:27px;
 cursor:pointer;
}
.action small{
 display:block;
 font-size:12px;
 margin-top:3px;
}
.caption{
 position:absolute;
 left:15px;
 bottom:90px;
 width:70%;
 z-index:3;
}
.user{
 font-weight:bold;
 font-size:17px;
 margin-bottom:8px;
}
.bottom{
 position:absolute;
 bottom:0;
 width:100%;
 height:60px;
 background:#111;
 display:flex;
 justify-content:space-around;
 align-items:center;
 z-index:6;
}
.bottom button{
 background:none;
 border:0;
 color:white;
 font-size:14px;
}
.upload{
 color:#ff1744!important;
 font-weight:bold;
}
input{display:none}
</style>
</
